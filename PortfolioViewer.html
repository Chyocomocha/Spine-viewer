<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine Portfolio Viewer</title>
<link rel="icon" href="data:,">
<style>
    :root {
        --bg: #151515;
        --panel: #202020;
        --panel-strong: #2a2a2a;
        --line: #3a3a3a;
        --text: #f3f3f3;
        --muted: #a8a8a8;
        --accent: #4f8cc9;
        --accent-strong: #72a8de;
        --danger: #c94f4f;
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        overflow: hidden;
    }

    .app {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
        width: 100%;
        height: 100%;
        min-height: 620px;
    }

    .sidebar {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--panel);
        border-right: 1px solid var(--line);
    }

    .brand {
        padding: 18px 16px 14px;
        border-bottom: 1px solid var(--line);
    }

    .brand h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 0;
    }

    .brand p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
    }

    .nav {
        overflow: auto;
        padding: 12px;
    }

    .group {
        margin-bottom: 18px;
    }

    .group-title {
        margin: 0 0 8px;
        padding: 0 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        text-transform: uppercase;
    }

    .item-list {
        display: grid;
        gap: 6px;
    }

    .item-button {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        width: 100%;
        min-height: 42px;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
    }

    .item-button:hover {
        background: var(--panel-strong);
        border-color: var(--line);
    }

    .item-button.active {
        background: rgba(79, 140, 201, 0.18);
        border-color: var(--accent);
    }

    .item-name {
        overflow: hidden;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .item-type {
        margin-left: 8px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
    }

    .stage {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
        background: #191919;
    }

    .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
        padding: 12px 14px;
        background: #191919;
        border-bottom: 1px solid var(--line);
    }

    .current {
        min-width: 0;
    }

    .current-title {
        overflow: hidden;
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .current-subtitle {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.2;
    }

    .toolbar-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 8px;
    }

    .icon-button {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
    }

    .icon-button:hover {
        border-color: var(--accent-strong);
        color: var(--accent-strong);
    }

    .icon-button svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
    }

    .viewer-wrap {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: #191919;
    }

    .viewer-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #191919;
    }

    .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #191919;
        color: var(--muted);
        font-size: 14px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 160ms ease;
    }

    .loading.visible {
        opacity: 1;
    }

    .error {
        color: var(--danger);
    }

    @media (max-width: 760px) {
        body {
            overflow: auto;
        }

        .app {
            grid-template-columns: 1fr;
            grid-template-rows: auto minmax(560px, calc(100vh - 210px));
            min-height: 100%;
        }

        .sidebar {
            border-right: 0;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            padding: 14px 14px 10px;
        }

        .nav {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 10px 12px 12px;
        }

        .group {
            flex: 0 0 210px;
            margin-bottom: 0;
        }

        .toolbar {
            align-items: flex-start;
            padding: 10px 12px;
        }

        .current-title {
            font-size: 15px;
        }
    }
</style>
</head>
<body>
<main class="app">
    <aside class="sidebar">
        <header class="brand">
            <h1>Spine Portfolio</h1>
            <p id="item-count"></p>
        </header>
        <nav class="nav" id="nav" aria-label="Portfolio items"></nav>
    </aside>

    <section class="stage" aria-label="Selected Spine viewer">
        <header class="toolbar">
            <div class="current">
                <h2 class="current-title" id="current-title"></h2>
                <div class="current-subtitle" id="current-subtitle"></div>
            </div>
            <div class="toolbar-actions">
                <button class="icon-button" id="reload-button" type="button" title="Reload">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                        <path d="M21 4v7h-7"></path>
                    </svg>
                </button>
                <button class="icon-button" id="open-button" type="button" title="Open">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 3h6v6"></path>
                        <path d="M10 14 21 3"></path>
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    </svg>
                </button>
            </div>
        </header>
        <div class="viewer-wrap" id="viewer-wrap">
            <div class="loading visible" id="loading">Loading</div>
        </div>
    </section>
</main>

<script>
    const groups = [
        {
            title: "Character",
            items: [
                { id: "narin", name: "Narin", type: "LD", file: "Narin.html" },
                { id: "mongle", name: "Mongle", type: "LD", file: "Mongle.html" },
                { id: "hina", name: "Hina", type: "LD", file: "Hina.html" },
                { id: "siphon", name: "Siphon", type: "LD", file: "Siphon.html" }
            ]
        },
        {
            title: "SD Character",
            items: [
                { id: "sd-narin", name: "Narin", type: "SD", file: "SD_Narin.html" },
                { id: "sd-mongle", name: "Mongle", type: "SD", file: "SD_Mongle.html" },
                { id: "sd-hina", name: "Hina", type: "SD", file: "SD_Hina.html" },
                { id: "sd-siphon", name: "Siphon", type: "SD", file: "SD_Siphon.html" }
            ]
        },
        {
            title: "Cutscene",
            items: [
                { id: "cut-narin", name: "Narin", type: "Scene", file: "Narin_Story_Scene.html" },
                { id: "cut-mongle", name: "Mongle", type: "Scene", file: "Mongle_Story_Scene.html" },
                { id: "cut-hina", name: "Hina", type: "Scene", file: "Hina_Story_Scene.html" }
            ]
        },
        {
            title: "Monster",
            items: [
                { id: "flower", name: "Flower Monster", type: "Boss", file: "Monster_Boss_Flower.html" },
                { id: "flower-2", name: "Flower Boss 2", type: "Boss", file: "Monster_Boss_Flower2.html" },
                { id: "cragor", name: "Cragor", type: "Boss", file: "CragorBoss.html" },
                { id: "wing", name: "Wing", type: "Boss", file: "Monster_Boss_Wing.html" },
                { id: "mirelord", name: "Mirelord", type: "Boss", file: "MirelordBoss.html" }
            ]
        },
        {
            title: "Joint Projects",
            items: [
                { id: "artz", name: "Artz", type: "Character", file: "Artz.html" },
                { id: "cola", name: "Cola", type: "Character", file: "Cola.html" },
                { id: "artz-ingame", name: "Artz Ingame", type: "Ingame", file: "Artz_Ingame.html" },
                { id: "cola-ingame", name: "Cola Ingame", type: "Ingame", file: "Cola_Ingame.html" },
                { id: "girl", name: "Girl Character", type: "Character", file: "Girl_Character.html" },
                { id: "boy", name: "Boy Character", type: "Character", file: "Boy_Character.html" }
            ]
        }
    ];

    const allItems = groups.flatMap(group => group.items.map(item => ({ ...item, group: group.title })));
    const nav = document.getElementById("nav");
    const viewerWrap = document.getElementById("viewer-wrap");
    const loading = document.getElementById("loading");
    const currentTitle = document.getElementById("current-title");
    const currentSubtitle = document.getElementById("current-subtitle");
    const openButton = document.getElementById("open-button");
    const reloadButton = document.getElementById("reload-button");
    const itemCount = document.getElementById("item-count");

    let currentItem = null;
    let currentFrame = null;
    let loadTimer = null;
    let switchTimer = null;

    itemCount.textContent = `${allItems.length} works`;

    function renderNav() {
        nav.innerHTML = "";

        groups.forEach(group => {
            const section = document.createElement("section");
            section.className = "group";

            const title = document.createElement("h3");
            title.className = "group-title";
            title.textContent = group.title;
            section.appendChild(title);

            const list = document.createElement("div");
            list.className = "item-list";

            group.items.forEach(item => {
                const button = document.createElement("button");
                button.className = "item-button";
                button.type = "button";
                button.dataset.itemId = item.id;
                button.innerHTML = `<span class="item-name"></span><span class="item-type"></span>`;
                button.querySelector(".item-name").textContent = item.name;
                button.querySelector(".item-type").textContent = item.type;
                button.addEventListener("click", () => selectItem(item.id, true));
                list.appendChild(button);
            });

            section.appendChild(list);
            nav.appendChild(section);
        });
    }

    function getInitialItemId() {
        const params = new URLSearchParams(window.location.search);
        const requested = params.get("item");
        return allItems.some(item => item.id === requested) ? requested : allItems[0].id;
    }

    function setActiveButton(itemId) {
        document.querySelectorAll(".item-button").forEach(button => {
            button.classList.toggle("active", button.dataset.itemId === itemId);
        });
    }

    function setLoading(message, isError) {
        loading.textContent = message;
        loading.classList.toggle("error", Boolean(isError));
        loading.classList.add("visible");
    }

    function hideLoading() {
        loading.classList.remove("visible");
    }

    function createFrame(item) {
        const frame = document.createElement("iframe");
        frame.className = "viewer-frame";
        frame.title = item.name;
        frame.allow = "fullscreen";
        frame.src = item.file;
        frame.addEventListener("load", () => {
            window.clearTimeout(loadTimer);
            hideLoading();
        });
        frame.addEventListener("error", () => {
            window.clearTimeout(loadTimer);
            setLoading("Load failed", true);
        });
        return frame;
    }

    function replaceFrame(item) {
        setLoading("Loading", false);
        window.clearTimeout(switchTimer);

        if (currentFrame) {
            currentFrame.src = "about:blank";
            currentFrame.remove();
            currentFrame = null;
        }

        window.clearTimeout(loadTimer);
        loadTimer = window.setTimeout(() => {
            setLoading("Still loading", false);
        }, 2500);

        switchTimer = window.setTimeout(() => {
            if (!currentItem || currentItem.id !== item.id) return;
            currentFrame = createFrame(item);
            viewerWrap.appendChild(currentFrame);
        }, 80);
    }

    function updateUrl(itemId) {
        const url = new URL(window.location.href);
        url.searchParams.set("item", itemId);
        window.history.replaceState(null, "", url);
    }

    function selectItem(itemId, shouldUpdateUrl) {
        const item = allItems.find(entry => entry.id === itemId);
        if (!item || currentItem?.id === item.id) return;

        currentItem = item;
        currentTitle.textContent = item.name;
        currentSubtitle.textContent = `${item.group} / ${item.type}`;
        setActiveButton(item.id);
        replaceFrame(item);

        if (shouldUpdateUrl) updateUrl(item.id);
    }

    openButton.addEventListener("click", () => {
        if (!currentItem) return;
        window.open(currentItem.file, "_blank", "noopener");
    });

    reloadButton.addEventListener("click", () => {
        if (!currentItem) return;
        replaceFrame(currentItem);
    });

    window.addEventListener("message", event => {
        if (event.data === "spine-context-lost" && currentItem) {
            replaceFrame(currentItem);
        }
    });

    window.addEventListener("beforeunload", () => {
        window.clearTimeout(switchTimer);
        window.clearTimeout(loadTimer);
        if (!currentFrame) return;
        currentFrame.src = "about:blank";
    });

    renderNav();
    selectItem(getInitialItemId(), false);
</script>
</body>
</html>
