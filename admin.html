<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Portfolio Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./assets/admin.css">
</head>
<body>
<main class="admin-app" aria-label="Portfolio admin">
    <header class="topbar">
        <div>
            <h1>Portfolio Admin</h1>
            <div class="repo-label">Local editor - data/portfolio.json</div>
        </div>
        <div class="topbar-actions">
            <a class="button secondary" href="./index.html">View</a>
            <button class="button secondary" id="reload-button" type="button">Reload</button>
            <button class="button primary" id="save-button" type="button">Save now</button>
        </div>
    </header>

    <section class="file-panel" aria-label="Local autosave">
        <div class="file-help">Auto-saves to <strong>data/portfolio.json</strong> while this local editor is running. To publish, run <strong>publish-portfolio.bat</strong>.</div>
        <div class="status" id="status"></div>
    </section>

    <section class="workspace">
        <aside class="list-pane" aria-label="Categories">
            <div class="pane-head">
                <h2>Categories</h2>
                <button class="button compact" id="add-category-button" type="button">Add</button>
            </div>
            <div class="stack-list" id="category-list"></div>
        </aside>

        <section class="editor-pane" aria-label="Editor">
            <div class="tabs" role="tablist" aria-label="Edit sections">
                <button class="tab active" type="button" data-tab="site">Site</button>
                <button class="tab" type="button" data-tab="category">Category</button>
                <button class="tab" type="button" data-tab="work">Work</button>
                <button class="tab" type="button" data-tab="json">JSON</button>
            </div>

            <section class="tab-panel active" id="site-panel">
                <div class="form-grid">
                    <label class="field">
                        <span>Title</span>
                        <input id="site-title" type="text">
                    </label>
                    <label class="field">
                        <span>Subtitle</span>
                        <input id="site-subtitle" type="text">
                    </label>
                    <label class="field wide">
                        <span>Description</span>
                        <textarea id="site-description" rows="4"></textarea>
                    </label>
                    <label class="field">
                        <span>Default work</span>
                        <select id="site-default"></select>
                    </label>
                </div>
            </section>

            <section class="tab-panel" id="category-panel">
                <div class="split-editor">
                    <div>
                        <div class="section-actions">
                            <button class="button compact" id="category-up-button" type="button">Up</button>
                            <button class="button compact" id="category-down-button" type="button">Down</button>
                            <button class="button danger compact" id="delete-category-button" type="button">Delete</button>
                        </div>
                        <div class="form-grid">
                            <label class="field">
                                <span>ID</span>
                                <input id="category-id" type="text" spellcheck="false">
                            </label>
                            <label class="field">
                                <span>Title</span>
                                <input id="category-title" type="text">
                            </label>
                            <label class="field wide">
                                <span>Description</span>
                                <textarea id="category-description" rows="4"></textarea>
                            </label>
                            <label class="check-field">
                                <input id="category-hidden" type="checkbox">
                                <span>Hidden</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <div class="pane-head inline">
                            <h3>Works</h3>
                            <button class="button compact" id="add-item-button" type="button">Add</button>
                        </div>
                        <div class="stack-list" id="item-list"></div>
                    </div>
                </div>
            </section>

            <section class="tab-panel" id="work-panel">
                <div class="section-actions">
                    <button class="button compact" id="item-up-button" type="button">Up</button>
                    <button class="button compact" id="item-down-button" type="button">Down</button>
                    <button class="button danger compact" id="delete-item-button" type="button">Delete</button>
                </div>
                <div class="form-grid">
                    <label class="field">
                        <span>ID</span>
                        <input id="item-id" type="text" spellcheck="false">
                    </label>
                    <label class="field">
                        <span>Name</span>
                        <input id="item-name" type="text">
                    </label>
                    <label class="field wide">
                        <span>Description shown below player</span>
                        <textarea id="item-description" rows="4"></textarea>
                    </label>
                    <label class="field">
                        <span>Badge</span>
                        <input id="item-badge" type="text">
                    </label>
                    <label class="field">
                        <span>File</span>
                        <input id="item-file" type="text" spellcheck="false">
                    </label>
                    <label class="field">
                        <span>Category</span>
                        <select id="item-category"></select>
                    </label>
                    <label class="field">
                        <span>Role</span>
                        <input id="item-role" type="text">
                    </label>
                    <label class="field">
                        <span>Year</span>
                        <input id="item-year" type="text">
                    </label>
                    <label class="field wide">
                        <span>Tags</span>
                        <input id="item-tags" type="text">
                    </label>
                    <label class="check-field">
                        <input id="item-hidden" type="checkbox">
                        <span>Hidden</span>
                    </label>
                </div>
                <div class="links-head">
                    <h3>Links</h3>
                    <button class="button compact" id="add-link-button" type="button">Add</button>
                </div>
                <div class="links-list" id="links-list"></div>
            </section>

            <section class="tab-panel" id="json-panel">
                <textarea class="json-preview" id="json-preview" readonly spellcheck="false"></textarea>
            </section>
        </section>

        <aside class="validation-pane" aria-label="Validation">
            <h2>Validation</h2>
            <div class="validation-list" id="validation-list"></div>
        </aside>
    </section>
</main>

<script type="module" src="./assets/admin.js"></script>
</body>
</html>
