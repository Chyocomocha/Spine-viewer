<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spine Portfolio</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./assets/portfolio.css">
</head>
<body>
<main class="app" aria-label="Spine portfolio">
    <aside class="sidebar">
        <header class="brand">
            <h1 id="site-title">Spine Portfolio</h1>
            <p id="site-subtitle"></p>
            <div class="site-meta" id="item-count"></div>
        </header>
        <nav class="nav" id="nav" aria-label="Portfolio items"></nav>
    </aside>

    <section class="stage" aria-label="Selected Spine viewer">
        <header class="toolbar">
            <div class="current">
                <h2 class="current-title" id="current-title">Loading</h2>
                <div class="current-subtitle" id="current-subtitle"></div>
                <p class="current-description" id="current-description"></p>
            </div>
            <div class="toolbar-actions">
                <button class="icon-button" id="reload-button" type="button" title="Reload" aria-label="Reload selected work">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                        <path d="M21 4v7h-7"></path>
                    </svg>
                </button>
                <button class="icon-button" id="open-button" type="button" title="Open" aria-label="Open selected work in a new tab">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 3h6v6"></path>
                        <path d="M10 14 21 3"></path>
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    </svg>
                </button>
            </div>
        </header>
        <div class="viewer-wrap" id="viewer-wrap">
            <div class="loading visible" id="loading">Loading portfolio</div>
        </div>
    </section>
</main>

<script type="module" src="./assets/portfolio.js"></script>
</body>
</html>
